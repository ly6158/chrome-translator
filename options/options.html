<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI 网页翻译 - 设置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1><span class="logo">译</span>AI 网页翻译 · 设置</h1>

    <form id="form" autocomplete="off">
      <section class="card">
        <h2>大模型配置</h2>
        <p class="desc">翻译通过调用 OpenAI 兼容的 Chat Completions 接口实现，填写任意兼容该协议的接口地址、API Key 与模型名称即可。</p>

        <div class="row">
          <label for="apiBaseUrl">API 地址（Base URL）</label>
          <input id="apiBaseUrl" name="apiBaseUrl" type="url" placeholder="https://api.openai.com/v1" required />
          <small class="hint">将请求 <code>{Base URL}/chat/completions</code>；也可直接填写完整的 /chat/completions 地址。</small>
        </div>

        <div class="row">
          <label for="apiKey">API Key</label>
          <div class="inline">
            <input id="apiKey" name="apiKey" type="password" placeholder="sk-..." spellcheck="false" />
            <button type="button" class="ghost" id="toggleKey">显示</button>
          </div>
          <small class="hint">API Key 仅保存在本地浏览器中；无需鉴权的接口可留空。</small>
        </div>

        <div class="row">
          <label for="model">模型名称</label>
          <input id="model" name="model" type="text" placeholder="gpt-4o-mini" required spellcheck="false" />
        </div>

        <div class="row">
          <label for="temperature">Temperature：<output id="temperatureValue"></output></label>
          <input id="temperature" name="temperature" type="range" min="0" max="2" step="0.1" />
          <small class="hint">数值越低译文越稳定，翻译场景建议 0 ~ 0.5。</small>
        </div>
      </section>

      <section class="card">
        <h2>翻译设置</h2>
        <div class="row">
          <label for="targetLang">默认目标语言</label>
          <select id="targetLang" name="targetLang"></select>
        </div>

        <div class="row">
          <label for="extraPrompt">额外翻译要求（可选）</label>
          <textarea id="extraPrompt" name="extraPrompt" rows="3" placeholder="例如：这是技术文档，专业术语保留英文原文；语气正式。"></textarea>
        </div>

        <div class="row checkbox">
          <label><input id="showFloatingButton" name="showFloatingButton" type="checkbox" /> 在页面右侧显示悬浮按钮</label>
          <small class="hint">关闭后可通过工具栏图标或快捷键 Alt+Shift+T 打开侧边栏。</small>
        </div>
      </section>

      <section class="card">
        <h2>高级</h2>
        <div class="grid">
          <div class="row">
            <label for="batchChars">每批最大字符数</label>
            <input id="batchChars" name="batchChars" type="number" min="200" max="20000" step="100" />
          </div>
          <div class="row">
            <label for="concurrency">并发请求数</label>
            <input id="concurrency" name="concurrency" type="number" min="1" max="10" step="1" />
          </div>
          <div class="row">
            <label for="timeout">请求超时（秒）</label>
            <input id="timeout" name="timeout" type="number" min="5" max="600" step="5" />
          </div>
        </div>
      </section>

      <div class="actions">
        <button type="submit" class="primary">保存</button>
        <button type="button" id="test">测试连接</button>
        <button type="button" id="reset" class="ghost">恢复默认</button>
      </div>
      <div id="status" class="status" hidden></div>
    </form>
  </main>

  <script src="../shared/constants.js"></script>
  <script src="options.js"></script>
</body>
</html>
